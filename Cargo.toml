[workspace]
resolver = "2"
members = [
    "crates/slicer-core",
    "crates/slicer-parser",
    "crates/slicer-passes",
    "crates/slicer-validator",
    "crates/slicer-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["CST-103 Team"]
license = "MIT"
repository = "https://github.com/example/rust-slicer"

[workspace.dependencies]
# Internal crates
slicer-core = { path = "crates/slicer-core" }
slicer-parser = { path = "crates/slicer-parser" }
slicer-passes = { path = "crates/slicer-passes" }
slicer-validator = { path = "crates/slicer-validator" }

# Parsing
clang = "2.0"

# Parallelism (future goal)
# rayon = "1.10"
# dashmap = "6.0"
# crossbeam = "0.8"

# CLI
clap = { version = "4.5", features = ["derive", "env"] }
indicatif = "0.17"
console = "0.15"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
tempfile = "3.10"
which = "6.0"
regex = "1.10"
once_cell = "1.19"
glob = "0.3"

# Testing
proptest = "1.4"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1  # Faster debug builds
